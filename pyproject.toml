[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-mnovo"
version = "0.1.0"
description = "Microbial-domain de novo peptide sequencing from tandem mass spectra"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {file = "LICENSE"}
authors = [{name = "Jingwen Ye"}]
dependencies = [
  "setuptools<81",
  "click==8.1.3",
  "cupy-cuda12x==13.6.0",
  "depthcharge-ms==0.1.0",
  "einops==0.6.0",
  "lmdb==1.7.3",
  "numpy==1.23.5",
  "pandas==1.5.2",
  "psutil==5.9.4",
  "pyteomics==4.5.6",
  "pytorch-lightning==1.8.6",
  "PyYAML==6.0",
  "spectrum-utils==0.4.1",
  "tensorboard==2.10.0",
  "torch==2.5.1",
  "torchmetrics==0.11.0",
  "torchvision==0.20.1",
  "tqdm==4.64.1",
]

[project.scripts]
pi-mnovo = "MNovo.cli:main"

[tool.setuptools.packages.find]
include = ["MNovo*"]

[tool.setuptools.package-data]
MNovo = ["config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
