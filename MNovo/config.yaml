# Optional runtime controls for prediction and evaluation.
#
# Model architecture, preprocessing, candidate generation, routing, confidence,
# and FDR settings are frozen in the checkpoint and are loaded automatically.
# Most users do not need to pass this file. Command-line options take precedence.
runtime:
  batch_size: 128
  n_workers: 16
  ctc_processes: 16
  # temp_dir: /path/to/temporary/storage
